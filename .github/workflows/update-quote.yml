name: Update Daily Tech Quote

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  refresh-quote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch and Update
        run: |
          # Fetch from a reliable public quote API
          RESPONSE=$(curl -s https://dummyjson.com)
          
          # Extract values safely
          QUOTE=$(echo "$RESPONSE" | jq -r '.quote // empty')
          AUTHOR=$(echo "$RESPONSE" | jq -r '.author // empty')
          
          # Fallback mechanism if the API is down or returns invalid data
          if [ -z "$QUOTE" ]; then
            QUOTE="Stay hungry, stay foolish."
            AUTHOR="Steve Jobs"
          fi
          
          NEW_QUOTE="> \"$QUOTE\" — $AUTHOR"
          perl -i -0777 -pe "s/(<!-- QUOTE_START -->).*?(<!-- QUOTE_END -->)/\$1\n$NEW_QUOTE\n\$2/s" README.md
          
      - name: Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git diff --quiet && git diff --staged --quiet || (git add README.md && git commit -m "ci: update quote" && git push)
