name: Update Daily Tech Quote

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  refresh-quote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch and Update
        run: |
          # A pre-defined array of classic programming quotes
          QUOTES=(
            "\"Stay hungry, stay foolish.\" — Steve Jobs"
            "\"Talk is cheap. Show me the code.\" — Linus Torvalds"
            "\"Programs must be written for people to read, and only incidentally for machines to execute.\" — Harold Abelson"
            "\"Truth can only be found in one place: the code.\" — Robert C. Martin"
            "\"Walking on water and developing software from a specification are easy if both are frozen.\" — Edward V. Berard"
          )
          
          # Pick a random index based on array length
          RANDOM_INDEX=$(( RANDOM % ${#QUOTES[@]} ))
          NEW_QUOTE="> ${QUOTES[$RANDOM_INDEX]}"
          
          echo "Selected quote: $NEW_QUOTE"
          
          # Update the content inside the README.md placeholders safely
          perl -i -0777 -pe "s/(<!-- QUOTE_START -->).*?(<!-- QUOTE_END -->)/\$1\n$NEW_QUOTE\n\$2/s" README.md
          
      - name: Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && git diff --staged --quiet || (git add README.md && git commit -m "ci: update quote" && git push)
